name: ci

on:
  push:
  pull_request:

# A newer push to the same ref supersedes a queued or running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Linux job covers every supported Python sequentially: fewer jobs
  # queue less and finish faster than a wide matrix.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token lets the Codecov upload authenticate with GitHub OIDC, so no
    # CODECOV_TOKEN secret is needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13
      # coverage.py is a CI-only tool; the plugin itself stays dependency-free.
      - name: Install coverage
        run: python3.13 -m pip install coverage
      # 3.13 runs the suite under coverage; the other versions run it plain.
      - name: Test on each Python
        run: |
          for v in 3.11 3.12 3.13; do
            echo "::group::Python $v"
            python$v -m py_compile *.py bin/horchestra-team bin/horchestra-tag
            if [ "$v" = "3.13" ]; then
              python$v -W error::ResourceWarning -m coverage run --source=. --omit='tests/*,tools/*' -m unittest discover -s tests -t .
            else
              python$v -W error::ResourceWarning -m unittest discover -s tests -t .
            fi
            echo "::endgroup::"
          done
      - name: Coverage report
        run: |
          python3.13 -m coverage report
          python3.13 -m coverage xml -o coverage.xml
      # Codecov problems must never fail CI. Pull requests from forks cannot
      # request an OIDC token; Codecov accepts those uploads tokenless.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          files: coverage.xml
          fail_ci_if_error: false

  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile *.py bin/horchestra-team bin/horchestra-tag
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
