name: ci

on:
  push:
  pull_request:

# A newer push to the same ref supersedes a queued or running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Linux job covers every supported Python sequentially: private repos
  # get few concurrent runners, and a wide matrix leaves jobs stuck in queue.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.11
            3.12
            3.13
      - name: Test on each Python
        run: |
          for v in 3.11 3.12 3.13; do
            echo "::group::Python $v"
            python$v -m py_compile *.py bin/agentmap-team bin/agentmap-tag
            python$v -W error::ResourceWarning -m unittest discover -s tests -t .
            echo "::endgroup::"
          done

  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compile
        run: python -m py_compile *.py bin/agentmap-team bin/agentmap-tag
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
