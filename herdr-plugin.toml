id = "horchestra"
name = "Horchestra"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Orchestrator-led agent teams per space, with a live agent map in every tab"
platforms = ["linux", "macos"]

# After a Herdr restart, wait for team agents to resume and repair them.
[[startup]]
command = ["python3", "team.py", "restore"]

[[actions]]
id = "toggle"
title = "Toggle agent map"
contexts = ["workspace"]
command = ["python3", "toggle.py"]

[[actions]]
id = "overview"
title = "Toggle all-spaces agent map"
contexts = ["workspace"]
command = ["python3", "toggle.py", "--overview"]

[[actions]]
id = "team-up"
title = "Start this space's agent team"
contexts = ["workspace"]
command = ["python3", "team.py", "up"]

[[actions]]
id = "setup"
title = "Set up Horchestra (commands, orchestrator agent, map key)"
contexts = ["workspace"]
command = ["python3", "install.py", "install"]

[[actions]]
id = "teardown"
title = "Remove what Horchestra setup added"
contexts = ["workspace"]
command = ["python3", "install.py", "teardown"]

[[panes]]
id = "map"
title = "horchestra-map"
placement = "split"
command = ["python3", "agentmap.py"]

[[panes]]
id = "overview"
title = "horchestra-overview"
placement = "split"
command = ["python3", "agentmap.py", "--all"]
